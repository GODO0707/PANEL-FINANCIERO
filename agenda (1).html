<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --purple: #534AB7;
    --green: #1D9E75;
    --red: #D85A30;
    --orange: #BA7517;
    --blue: #185FA5;
    --bg: #f5f4f0;
    --white: #fff;
    --border: rgba(0,0,0,0.08);
    --text: #1a1a18;
    --muted: #888;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Header */
  header {
    background: var(--white);
    border-bottom: 0.5px solid var(--border);
    padding: 0 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 { font-size: 16px; font-weight: 600; }
  .header-date { font-size: 12px; color: var(--muted); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
    font-size: 10px;
    gap: 3px;
    transition: color 0.15s;
  }

  .nav-btn.active { color: var(--purple); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* Secciones */
  .section { display: none; padding: 1rem 0.75rem; max-width: 480px; margin: 0 auto; }
  .section.active { display: block; }

  /* Calendario */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .cal-header h2 { font-size: 16px; font-weight: 500; text-transform: capitalize; }

  .cal-nav-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }

  .cal-grid {
    background: var(--white);
    border-radius: 14px;
    border: 0.5px solid var(--border);
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #f8f7f4;
    border-bottom: 0.5px solid var(--border);
  }

  .cal-day-name {
    text-align: center;
    padding: 8px 0;
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
  }

  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }

  .cal-cell {
    border: 0.5px solid rgba(0,0,0,0.04);
    min-height: 52px;
    padding: 4px;
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }

  .cal-cell:hover { background: #f8f7f4; }
  .cal-cell.empty { cursor: default; background: #fafaf8; }
  .cal-cell.today .cal-num { background: var(--purple); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.selected { background: #f0eeff; }

  .cal-num { font-size: 12px; font-weight: 500; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }

  .cal-dots { display: flex; flex-wrap: wrap; gap: 2px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* Eventos del día */
  .day-events-header {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.75rem;
    text-transform: capitalize;
  }

  .event-card {
    background: var(--white);
    border-radius: 12px;
    border: 0.5px solid var(--border);
    padding: 0.875rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .event-color-bar { width: 3px; border-radius: 2px; min-height: 36px; flex-shrink: 0; }
  .event-info { flex: 1; }
  .event-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .event-meta { font-size: 12px; color: var(--muted); }
  .event-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; padding: 0 0 0 8px; flex-shrink: 0; }
  .event-del:hover { color: var(--red); }

  /* Tareas */
  .task-card {
    background: var(--white);
    border-radius: 12px;
    border: 0.5px solid var(--border);
    padding: 0.875rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .task-check {
    width: 22px; height: 22px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .task-check.done { background: var(--green); border-color: var(--green); color: white; font-size: 12px; }
  .task-info { flex: 1; }
  .task-title { font-size: 14px; font-weight: 500; }
  .task-title.done { text-decoration: line-through; color: var(--muted); }
  .task-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; }
  .task-del:hover { color: var(--red); }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 1rem 0 0.5rem;
  }

  /* Botón añadir flotante */
  .fab {
    position: fixed;
    bottom: 75px;
    right: 1.25rem;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--purple);
    color: white;
    border: none;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(83,74,183,0.4);
    z-index: 99;
    transition: transform 0.15s;
  }

  .fab:active { transform: scale(0.95); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    padding: 1.5rem 1.25rem;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }

  .form-group { margin-bottom: 1rem; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #fafaf8;
    color: var(--text);
    -webkit-appearance: none;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--purple); background: white; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }

  .type-btn {
    padding: 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }

  .type-btn.selected { border-color: var(--purple); color: var(--purple); background: #f0eeff; }
  .type-btn span { font-size: 20px; }

  .btn-row { display: flex; gap: 10px; margin-top: 1.25rem; }

  .btn-primary {
    flex: 1;
    padding: 13px;
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-secondary {
    padding: 13px 20px;
    background: none;
    color: var(--muted);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }

  /* Notificaciones */
  .notif-banner {
    background: var(--purple);
    color: white;
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }

  .notif-banner button {
    margin-top: 8px;
    background: white;
    color: var(--purple);
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }

  .empty-msg { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 13px; }

  .badge {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    border: 1.5px solid white;
  }

  .urgente { color: var(--red) !important; }
  .pronto { color: var(--orange) !important; }
</style>
</head>
<body>

<header>
  <h1>📅 Agenda</h1>
  <span class="header-date" id="header-date"></span>
</header>

<!-- Sección Calendario -->
<div class="section active" id="sec-calendario">
  <div class="cal-header">
    <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
    <h2 id="cal-month-label">—</h2>
    <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
  </div>
  <div class="cal-grid">
    <div class="cal-days-header">
      <div class="cal-day-name">L</div>
      <div class="cal-day-name">M</div>
      <div class="cal-day-name">X</div>
      <div class="cal-day-name">J</div>
      <div class="cal-day-name">V</div>
      <div class="cal-day-name">S</div>
      <div class="cal-day-name">D</div>
    </div>
    <div class="cal-body" id="cal-body"></div>
  </div>
  <div class="day-events-header" id="day-events-header"></div>
  <div id="day-events-list"></div>
</div>

<!-- Sección Tareas -->
<div class="section" id="sec-tareas">
  <div class="notif-banner" id="notif-banner">
    🔔 Activa las notificaciones para recibir recordatorios automáticos
    <br>
    <button onclick="activarNotificaciones()">Activar avisos</button>
  </div>
  <p class="section-title">Pendientes</p>
  <div id="tareas-pendientes"></div>
  <p class="section-title">Completadas</p>
  <div id="tareas-completadas"></div>
</div>

<!-- Sección Recordatorios -->
<div class="section" id="sec-recordatorios">
  <p class="section-title">Próximos recordatorios</p>
  <div id="recordatorios-list"></div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showSection('calendario', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>
    </svg>
    Calendario
  </button>
  <button class="nav-btn" onclick="showSection('tareas', this)" id="nav-tareas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
    </svg>
    Tareas
  </button>
  <button class="nav-btn" onclick="showSection('recordatorios', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
    </svg>
    Avisos
  </button>
</nav>

<!-- FAB -->
<button class="fab" onclick="abrirModal()" title="Añadir">+</button>

<!-- Modal añadir -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModalSiOverlay(event)">
  <div class="modal">
    <h3 id="modal-title">Nuevo evento</h3>

    <div class="type-selector">
      <button class="type-btn selected" onclick="selectType('cita', this)">
        <span>📅</span>Cita
      </button>
      <button class="type-btn" onclick="selectType('tarea', this)">
        <span>✅</span>Tarea
      </button>
      <button class="type-btn" onclick="selectType('recordatorio', this)">
        <span>🔔</span>Aviso
      </button>
    </div>

    <div class="form-group">
      <label>Título</label>
      <input type="text" id="f-titulo" placeholder="¿Qué tienes?" />
    </div>

    <div class="form-group">
      <label>Descripción (opcional)</label>
      <textarea id="f-desc" rows="2" placeholder="Notas..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="f-fecha" />
      </div>
      <div class="form-group" id="f-hora-group">
        <label>Hora</label>
        <input type="time" id="f-hora" />
      </div>
    </div>

    <div class="form-group" id="f-aviso-group">
      <label>Avisarme</label>
      <select id="f-aviso">
        <option value="0">En el momento</option>
        <option value="5">5 minutos antes</option>
        <option value="15" selected>15 minutos antes</option>
        <option value="30">30 minutos antes</option>
        <option value="60">1 hora antes</option>
        <option value="1440">1 día antes</option>
      </select>
    </div>

    <div class="form-group">
      <label>Color</label>
      <select id="f-color">
        <option value="#534AB7">Morado (profesional)</option>
        <option value="#1D9E75">Verde (personal)</option>
        <option value="#D85A30">Naranja (urgente)</option>
        <option value="#185FA5">Azul (médico)</option>
        <option value="#BA7517">Amarillo (gestión)</option>
      </select>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarEvento()">Guardar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vyxnnrbfuairbjostuqd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xiQ-BwtNNBguFj13GJVrxg_vjakBkft';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const DIAS = ['L','M','X','J','V','S','D'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let eventos = [];
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = toDateStr(new Date());
let currentType = 'cita';
let notifTimer = null;

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function today() { return toDateStr(new Date()); }

// --- Navegación ---
function showSection(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'tareas') renderTareas();
  if (name === 'recordatorios') renderRecordatorios();
}

// --- Calendario ---
function changeCalMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendario();
}

function renderCalendario() {
  document.getElementById('cal-month-label').textContent = `${MESES[calMonth]} ${calYear}`;
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  let startDow = firstDay.getDay();
  if (startDow === 0) startDow = 7;
  startDow--;

  const body = document.getElementById('cal-body');
  body.innerHTML = '';

  for (let i = 0; i < startDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    body.appendChild(cell);
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dateStr === today()) cell.classList.add('today');
    if (dateStr === selectedDate) cell.classList.add('selected');

    const dayEvts = eventos.filter(e => e.fecha === dateStr);
    const numEl = document.createElement('div');
    numEl.className = 'cal-num';
    numEl.textContent = d;
    cell.appendChild(numEl);

    if (dayEvts.length > 0) {
      const dots = document.createElement('div');
      dots.className = 'cal-dots';
      dayEvts.slice(0, 4).forEach(e => {
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        dot.style.background = e.color || '#534AB7';
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }

    cell.onclick = () => selectDay(dateStr);
    body.appendChild(cell);
  }

  renderDayEvents();
}

function selectDay(dateStr) {
  selectedDate = dateStr;
  renderCalendario();
}

function renderDayEvents() {
  const [y, m, d] = selectedDate.split('-');
  const fecha = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  const label = fecha.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('day-events-header').textContent = label.charAt(0).toUpperCase() + label.slice(1);

  const list = document.getElementById('day-events-list');
  const dayEvts = eventos.filter(e => e.fecha === selectedDate).sort((a,b) => (a.hora||'').localeCompare(b.hora||''));

  if (dayEvts.length === 0) {
    list.innerHTML = '<div class="empty-msg">Sin eventos este día.<br>Pulsa + para añadir.</div>';
    return;
  }

  list.innerHTML = '';
  dayEvts.forEach(e => {
    const card = document.createElement('div');
    card.className = 'event-card';
    const icon = e.tipo === 'tarea' ? '✅' : e.tipo === 'recordatorio' ? '🔔' : '📅';
    card.innerHTML = `
      <div class="event-color-bar" style="background:${e.color||'#534AB7'}"></div>
      <div class="event-info">
        <div class="event-title">${icon} ${e.titulo}</div>
        <div class="event-meta">${e.hora || ''} ${e.desc ? '· ' + e.desc : ''}</div>
      </div>
      <button class="event-del" onclick="eliminarEvento('${e.id}')">×</button>`;
    list.appendChild(card);
  });
}

// --- Tareas ---
function renderTareas() {
  const pendientes = eventos.filter(e => e.tipo === 'tarea' && !e.done).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const completadas = eventos.filter(e => e.tipo === 'tarea' && e.done).sort((a,b) => b.fecha.localeCompare(a.fecha));

  const pEl = document.getElementById('tareas-pendientes');
  const cEl = document.getElementById('tareas-completadas');

  pEl.innerHTML = '';
  if (pendientes.length === 0) pEl.innerHTML = '<div class="empty-msg">Sin tareas pendientes 🎉</div>';
  else pendientes.forEach(t => pEl.appendChild(crearTarjeta(t)));

  cEl.innerHTML = '';
  if (completadas.length === 0) cEl.innerHTML = '<div class="empty-msg">Ninguna completada aún</div>';
  else completadas.slice(0, 5).forEach(t => cEl.appendChild(crearTarjeta(t)));
}

function crearTarjeta(t) {
  const card = document.createElement('div');
  card.className = 'task-card';
  const urgencia = t.fecha < today() && !t.done ? 'urgente' : t.fecha === today() && !t.done ? 'pronto' : '';
  card.innerHTML = `
    <div class="task-check ${t.done ? 'done' : ''}" onclick="toggleTarea('${t.id}')">${t.done ? '✓' : ''}</div>
    <div class="task-info">
      <div class="task-title ${t.done ? 'done' : ''}">${t.titulo}</div>
      <div class="task-meta ${urgencia}">${formatFecha(t.fecha)} ${t.hora ? '· ' + t.hora : ''}</div>
    </div>
    <button class="task-del" onclick="eliminarEvento('${t.id}')">×</button>`;
  return card;
}

function toggleTarea(id) {
  const e = eventos.find(x => x.id === id);
  if (e) { e.done = !e.done; guardarEnSupabase(); renderTareas(); }
}

// --- Recordatorios ---
function renderRecordatorios() {
  const ahora = new Date();
  const proximos = eventos
    .filter(e => e.tipo !== 'tarea' || !e.done)
    .filter(e => {
      const d = new Date(e.fecha + (e.hora ? 'T' + e.hora : 'T00:00'));
      return d >= ahora;
    })
    .sort((a,b) => {
      const da = new Date(a.fecha + (a.hora ? 'T'+a.hora : 'T00:00'));
      const db = new Date(b.fecha + (b.hora ? 'T'+b.hora : 'T00:00'));
      return da - db;
    })
    .slice(0, 20);

  const list = document.getElementById('recordatorios-list');
  if (proximos.length === 0) {
    list.innerHTML = '<div class="empty-msg">No hay próximos eventos</div>';
    return;
  }

  list.innerHTML = '';
  proximos.forEach(e => {
    const card = document.createElement('div');
    card.className = 'event-card';
    const icon = e.tipo === 'tarea' ? '✅' : e.tipo === 'recordatorio' ? '🔔' : '📅';
    const diff = diasRestantes(e.fecha);
    card.innerHTML = `
      <div class="event-color-bar" style="background:${e.color||'#534AB7'}"></div>
      <div class="event-info">
        <div class="event-title">${icon} ${e.titulo}</div>
        <div class="event-meta">${formatFecha(e.fecha)} ${e.hora ? '· ' + e.hora : ''} · <span class="${diff === 0 ? 'pronto' : diff < 0 ? 'urgente' : ''}">${diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : diff > 1 ? 'En ' + diff + ' días' : 'Vencido'}</span></div>
      </div>
      <button class="event-del" onclick="eliminarEvento('${e.id}')">×</button>`;
    list.appendChild(card);
  });
}

function diasRestantes(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fecha + 'T00:00');
  return Math.round((f - hoy) / 86400000);
}

function formatFecha(f) {
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

// --- Modal ---
function abrirModal() {
  document.getElementById('modal-overlay').classList.add('open');
  const hoy = today();
  document.getElementById('f-fecha').value = selectedDate || hoy;
  document.getElementById('f-titulo').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-hora').value = '';
  selectType('cita', document.querySelector('.type-btn'));
  setTimeout(() => document.getElementById('f-titulo').focus(), 100);
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function cerrarModalSiOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) cerrarModal();
}

function selectType(type, btn) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('f-hora-group').style.display = type === 'tarea' ? 'none' : 'block';
  document.getElementById('f-aviso-group').style.display = type === 'tarea' ? 'none' : 'block';
  document.getElementById('modal-title').textContent = type === 'cita' ? 'Nueva cita' : type === 'tarea' ? 'Nueva tarea' : 'Nuevo recordatorio';
}

function guardarEvento() {
  const titulo = document.getElementById('f-titulo').value.trim();
  const fecha = document.getElementById('f-fecha').value;
  if (!titulo || !fecha) { alert('Indica al menos el título y la fecha'); return; }

  const evento = {
    id: Date.now().toString(),
    tipo: currentType,
    titulo,
    desc: document.getElementById('f-desc').value.trim(),
    fecha,
    hora: document.getElementById('f-hora').value || null,
    aviso: parseInt(document.getElementById('f-aviso').value),
    color: document.getElementById('f-color').value,
    done: false,
    creado: new Date().toISOString()
  };

  eventos.push(evento);
  programarNotificacion(evento);
  guardarEnSupabase();
  cerrarModal();
  renderCalendario();
  if (document.getElementById('sec-tareas').classList.contains('active')) renderTareas();
  if (document.getElementById('sec-recordatorios').classList.contains('active')) renderRecordatorios();
}

function eliminarEvento(id) {
  if (!confirm('¿Eliminar este evento?')) return;
  eventos = eventos.filter(e => e.id !== id);
  guardarEnSupabase();
  renderCalendario();
  renderTareas();
  renderRecordatorios();
}

// --- Notificaciones ---
async function activarNotificaciones() {
  if (!('Notification' in window)) { alert('Tu navegador no soporta notificaciones'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    document.getElementById('notif-banner').style.display = 'none';
    localStorage.setItem('notif_activadas', '1');
    new Notification('✅ Agenda Personal', { body: 'Notificaciones activadas correctamente' });
    programarTodasNotificaciones();
  } else {
    alert('No se pudieron activar las notificaciones. Comprueba los ajustes del iPhone.');
  }
}

function programarNotificacion(evento) {
  if (Notification.permission !== 'granted') return;
  if (!evento.hora) return;
  const [h, m] = evento.hora.split(':');
  const fecha = new Date(evento.fecha + 'T' + evento.hora);
  const notifTime = fecha.getTime() - (evento.aviso || 0) * 60000;
  const ahora = Date.now();
  if (notifTime <= ahora) return;
  const delay = notifTime - ahora;
  if (delay < 86400000) { // Solo si es en menos de 24h
    setTimeout(() => {
      new Notification('📅 ' + evento.titulo, {
        body: evento.desc || (evento.aviso > 0 ? `En ${evento.aviso} minutos` : 'Ahora'),
        icon: '/favicon.ico'
      });
    }, delay);
  }
}

function programarTodasNotificaciones() {
  eventos.forEach(e => programarNotificacion(e));
}

// --- Supabase ---
async function guardarEnSupabase() {
  try {
    const payload = JSON.parse(JSON.stringify(eventos));
    const { error } = await db.from('agenda').upsert({ id: 1, contenido: payload });
    if (error) console.error('Error guardando:', error);
  } catch(e) { console.error(e); }
}

async function cargarDeSupabase() {
  try {
    const { data, error } = await db.from('agenda').select('contenido').eq('id', 1).single();
    if (!error && data && data.contenido) eventos = data.contenido;
  } catch(e) {
    console.log('Sin datos previos');
  }
}

// --- Init ---
async function init() {
  // Fecha en header
  const hoy = new Date();
  document.getElementById('header-date').textContent = hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  await cargarDeSupabase();

  // Notificaciones
  if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
    document.getElementById('notif-banner').style.display = 'block';
  } else if (Notification.permission === 'granted') {
    programarTodasNotificaciones();
  }

  renderCalendario();
}

init();
</script>
