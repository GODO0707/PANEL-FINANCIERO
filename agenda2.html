<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda Personal v3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; padding-bottom: 80px; }

  header { background: #fff; border-bottom: 0.5px solid rgba(0,0,0,0.1); padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 15px; font-weight: 600; }
  #save-ind { font-size: 11px; color: #1D9E75; }

  .tabs { display: flex; background: #fff; border-bottom: 0.5px solid rgba(0,0,0,0.08); }
  .tab { flex: 1; padding: 10px; border: none; background: none; font-family: inherit; font-size: 13px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: #534AB7; border-bottom-color: #534AB7; font-weight: 500; }

  .page { display: none; padding: 1rem 0.75rem; max-width: 500px; margin: 0 auto; }
  .page.active { display: block; }

  /* Calendario */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .cal-nav h2 { font-size: 15px; font-weight: 500; text-transform: capitalize; }
  .cal-nav button { background: none; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 16px; }

  .cal-grid { background: #fff; border-radius: 14px; border: 0.5px solid rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 1rem; }
  .cal-head { display: grid; grid-template-columns: repeat(7,1fr); background: #f8f7f4; border-bottom: 0.5px solid rgba(0,0,0,0.08); }
  .cal-head span { text-align: center; padding: 7px 0; font-size: 10px; font-weight: 500; color: #888; text-transform: uppercase; }
  .cal-body { display: grid; grid-template-columns: repeat(7,1fr); }
  .cal-cell { min-height: 50px; padding: 4px; cursor: pointer; border: 0.5px solid rgba(0,0,0,0.04); position: relative; }
  .cal-cell:hover { background: #f8f7f4; }
  .cal-cell.empty { background: #fafaf8; cursor: default; }
  .cal-cell.today .dn { background: #534AB7; color: #fff; border-radius: 50%; }
  .cal-cell.sel { background: #eeecff; }
  .dn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; margin-bottom: 2px; }
  .dots { display: flex; flex-wrap: wrap; gap: 2px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }

  .day-title { font-size: 13px; color: #888; margin-bottom: 0.75rem; text-transform: capitalize; }

  .ev-card { background: #fff; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.08); padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
  .ev-bar { width: 3px; min-height: 32px; border-radius: 2px; flex-shrink: 0; }
  .ev-info { flex: 1; }
  .ev-title { font-size: 14px; font-weight: 500; }
  .ev-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .ev-del { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 0 0 0 8px; }
  .ev-del:active { color: #D85A30; }

  /* Tareas */
  .task-card { background: #fff; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.08); padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
  .chk { width: 22px; height: 22px; border: 1.5px solid rgba(0,0,0,0.2); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
  .chk.done { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .task-info { flex: 1; }
  .task-t { font-size: 14px; font-weight: 500; }
  .task-t.done { text-decoration: line-through; color: #aaa; }
  .task-m { font-size: 12px; color: #888; margin-top: 2px; }
  .vencida { color: #D85A30 !important; }
  .hoy { color: #BA7517 !important; }

  .sec-label { font-size: 11px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin: 1rem 0 0.5rem; }
  .empty { text-align: center; padding: 1.5rem; color: #ccc; font-size: 13px; }

  /* FAB */
  .fab { position: fixed; bottom: 72px; right: 1.25rem; width: 52px; height: 52px; border-radius: 50%; background: #534AB7; color: #fff; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(83,74,183,0.35); z-index: 99; }

  /* Bottom nav */
  .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 0.5px solid rgba(0,0,0,0.08); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .bnav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; background: none; border: none; font-family: inherit; font-size: 10px; color: #aaa; cursor: pointer; gap: 3px; }
  .bnav-btn.active { color: #534AB7; }
  .bnav-btn svg { width: 22px; height: 22px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; }
  .overlay.open { display: block; }
  .modal { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 1.5rem 1.25rem 2rem; z-index: 201; display: none; max-height: 92vh; overflow-y: auto; }
  .modal.open { display: block; }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }

  .tipo-sel { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1.25rem; }
  .tipo-btn { padding: 10px 6px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 10px; background: none; font-family: inherit; font-size: 12px; font-weight: 500; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tipo-btn.sel { border-color: #534AB7; color: #534AB7; background: #f0eeff; }
  .tipo-btn span { font-size: 20px; }

  .fg { margin-bottom: 1rem; }
  .fg label { font-size: 11px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 5px; }
  .fg input, .fg select, .fg textarea { width: 100%; border: 0.5px solid rgba(0,0,0,0.18); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; background: #fafaf8; color: #1a1a18; outline: none; -webkit-appearance: none; appearance: none; }
  .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: #534AB7; background: #fff; }
  .fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-row { display: flex; gap: 10px; margin-top: 1.25rem; }
  .btn-ok { flex: 1; padding: 13px; background: #534AB7; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; }
  .btn-cancel { padding: 13px 18px; background: none; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 12px; font-size: 15px; font-family: inherit; cursor: pointer; color: #888; }
</style>
</head>
<body>

<header>
  <h1>📅 Agenda</h1>
  <span id="save-ind"></span>
</header>

<div class="tabs">
  <button class="tab active" onclick="goTab('cal',this)">Calendario</button>
  <button class="tab" onclick="goTab('tar',this)">Tareas</button>
  <button class="tab" onclick="goTab('rec',this)">Próximos</button>
</div>

<!-- Calendario -->
<div class="page active" id="pg-cal">
  <div class="cal-nav">
    <button onclick="navMes(-1)">‹</button>
    <h2 id="cal-label"></h2>
    <button onclick="navMes(1)">›</button>
  </div>
  <div class="cal-grid">
    <div class="cal-head">
      <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="cal-body" id="cal-body"></div>
  </div>
  <div class="day-title" id="day-title"></div>
  <div id="day-list"></div>
</div>

<!-- Tareas -->
<div class="page" id="pg-tar">
  <div class="sec-label">Pendientes</div>
  <div id="tar-pend"></div>
  <div class="sec-label">Completadas</div>
  <div id="tar-done"></div>
</div>

<!-- Próximos -->
<div class="page" id="pg-rec">
  <div class="sec-label">Próximos eventos</div>
  <div id="rec-list"></div>
</div>

<button class="fab" id="fab-btn">+</button>

<!-- Overlay y Modal -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <h3 id="modal-h">Nuevo evento</h3>
  <div class="tipo-sel">
    <button class="tipo-btn sel" onclick="setTipo('cita',this)"><span>📅</span>Cita</button>
    <button class="tipo-btn" onclick="setTipo('tarea',this)"><span>✅</span>Tarea</button>
    <button class="tipo-btn" onclick="setTipo('aviso',this)"><span>🔔</span>Aviso</button>
  </div>
  <div class="fg"><label>Título *</label><input type="text" id="f-tit" placeholder="¿Qué tienes?" /></div>
  <div class="fg"><label>Descripción</label><textarea id="f-desc" rows="2" placeholder="Notas..."></textarea></div>
  <div class="fg-row">
    <div class="fg"><label>Fecha *</label><input type="date" id="f-fecha" /></div>
    <div class="fg" id="g-hora"><label>Hora</label><input type="time" id="f-hora" /></div>
  </div>
  <div class="fg" id="g-aviso">
    <label>Avisarme</label>
    <select id="f-aviso">
      <option value="0">En el momento</option>
      <option value="15" selected>15 min antes</option>
      <option value="30">30 min antes</option>
      <option value="60">1 hora antes</option>
      <option value="1440">1 día antes</option>
    </select>
  </div>
  <div class="fg">
    <label>Color</label>
    <select id="f-color">
      <option value="#534AB7">Morado</option>
      <option value="#1D9E75">Verde</option>
      <option value="#D85A30">Naranja</option>
      <option value="#185FA5">Azul</option>
      <option value="#BA7517">Amarillo</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    <button class="btn-ok" id="btn-guardar">Guardar</button>
  </div>
</div>

<script>
// --- Supabase ---
const SURL = 'https://vyxnnrbfuairbjostuqd.supabase.co';
const SKEY = 'sb_publishable_xiQ-BwtNNBguFj13GJVrxg_vjakBkft';
const db = supabase.createClient(SURL, SKEY);

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let eventos = [];
let calY = new Date().getFullYear();
let calM = new Date().getMonth();
let selDate = hoy();
let tipo = 'cita';

function hoy() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function pad(n) { return String(n).padStart(2,'0'); }

function fmt(f) {
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

function diasR(f) {
  const h = new Date(); h.setHours(0,0,0,0);
  const d = new Date(f+'T00:00');
  return Math.round((d-h)/86400000);
}

// --- Tabs ---
function goTab(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-'+id).classList.add('active');
  btn.classList.add('active');
  if (id==='tar') renderTareas();
  if (id==='rec') renderProximos();
}

// --- Calendario ---
function navMes(d) {
  calM += d;
  if (calM>11) { calM=0; calY++; }
  if (calM<0)  { calM=11; calY--; }
  renderCal();
}

function renderCal() {
  document.getElementById('cal-label').textContent = `${MESES[calM]} ${calY}`;
  const first = new Date(calY, calM, 1);
  const last  = new Date(calY, calM+1, 0);
  let dow = first.getDay(); if (dow===0) dow=7; dow--;
  const body = document.getElementById('cal-body');
  body.innerHTML = '';
  for (let i=0;i<dow;i++) {
    const c=document.createElement('div'); c.className='cal-cell empty'; body.appendChild(c);
  }
  for (let d=1;d<=last.getDate();d++) {
    const ds = `${calY}-${pad(calM+1)}-${pad(d)}`;
    const c = document.createElement('div');
    c.className = 'cal-cell';
    if (ds===hoy()) c.classList.add('today');
    if (ds===selDate) c.classList.add('sel');
    const dn = document.createElement('div'); dn.className='dn'; dn.textContent=d; c.appendChild(dn);
    const evs = eventos.filter(e=>e.fecha===ds);
    if (evs.length>0) {
      const dots=document.createElement('div'); dots.className='dots';
      evs.slice(0,4).forEach(e=>{const dot=document.createElement('div');dot.className='dot';dot.style.background=e.color||'#534AB7';dots.appendChild(dot);});
      c.appendChild(dots);
    }
    c.onclick=()=>{ selDate=ds; renderCal(); };
    body.appendChild(c);
  }
  renderDia();
}

function renderDia() {
  const [y,m,d] = selDate.split('-');
  const f = new Date(parseInt(y),parseInt(m)-1,parseInt(d));
  const lbl = f.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('day-title').textContent = lbl.charAt(0).toUpperCase()+lbl.slice(1);
  const list = document.getElementById('day-list');
  const evs = eventos.filter(e=>e.fecha===selDate).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  if (evs.length===0) { list.innerHTML='<div class="empty">Sin eventos. Pulsa + para añadir.</div>'; return; }
  list.innerHTML='';
  evs.forEach(e=>{
    const ic = e.tipo==='tarea'?'✅':e.tipo==='aviso'?'🔔':'📅';
    const card=document.createElement('div'); card.className='ev-card';
    card.innerHTML=`<div class="ev-bar" style="background:${e.color||'#534AB7'}"></div>
      <div class="ev-info"><div class="ev-title">${ic} ${e.titulo}</div>
      <div class="ev-meta">${e.hora||''} ${e.desc?'· '+e.desc:''}</div></div>
      <button class="ev-del" data-id="${e.id}">×</button>`;
    list.appendChild(card);
  });
  list.querySelectorAll('.ev-del').forEach(btn=>{
    btn.addEventListener('click', function(ev) {
      ev.stopPropagation();
      eliminar(this.dataset.id);
    });
  });
}

// --- Tareas ---
function renderTareas() {
  const pend = eventos.filter(e=>e.tipo==='tarea'&&!e.done).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const done = eventos.filter(e=>e.tipo==='tarea'&&e.done).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const pEl = document.getElementById('tar-pend');
  const dEl = document.getElementById('tar-done');
  pEl.innerHTML = pend.length===0?'<div class="empty">Sin tareas pendientes 🎉</div>':'';
  pend.forEach(t=>{
    const dr=diasR(t.fecha);
    const cls=dr<0?'vencida':dr===0?'hoy':'';
    const card=document.createElement('div'); card.className='task-card';
    card.innerHTML=`<div class="chk" data-id="${t.id}"></div>
      <div class="task-info"><div class="task-t">${t.titulo}</div>
      <div class="task-m ${cls}">${fmt(t.fecha)}${t.hora?' · '+t.hora:''}</div></div>
      <button class="ev-del" data-id="${t.id}">×</button>`;
    pEl.appendChild(card);
  });
  dEl.innerHTML = done.length===0?'<div class="empty">Ninguna completada aún</div>':'';
  done.slice(0,5).forEach(t=>{
    const card=document.createElement('div'); card.className='task-card';
    card.innerHTML=`<div class="chk done" data-id="${t.id}">✓</div>
      <div class="task-info"><div class="task-t done">${t.titulo}</div>
      <div class="task-m">${fmt(t.fecha)}</div></div>
      <button class="ev-del" data-id="${t.id}">×</button>`;
    dEl.appendChild(card);
  });
  document.querySelectorAll('.chk').forEach(c=>{
    c.addEventListener('click', function() { toggleTarea(this.dataset.id); });
  });
  document.querySelectorAll('.ev-del').forEach(b=>{
    b.addEventListener('click', function() { eliminar(this.dataset.id); });
  });
}

function toggleTarea(id) {
  const e=eventos.find(x=>x.id===id);
  if(e){ e.done=!e.done; guardar(); renderTareas(); }
}

// --- Próximos ---
function renderProximos() {
  const ahora=new Date();
  const prox=eventos.filter(e=>!(e.tipo==='tarea'&&e.done)).filter(e=>{
    const d=new Date(e.fecha+(e.hora?'T'+e.hora:'T00:00'));
    return d>=ahora;
  }).sort((a,b)=>{
    return new Date(a.fecha+(a.hora?'T'+a.hora:'T00:00'))-new Date(b.fecha+(b.hora?'T'+b.hora:'T00:00'));
  }).slice(0,30);
  const list=document.getElementById('rec-list');
  if(prox.length===0){list.innerHTML='<div class="empty">No hay próximos eventos</div>';return;}
  list.innerHTML='';
  prox.forEach(e=>{
    const ic=e.tipo==='tarea'?'✅':e.tipo==='aviso'?'🔔':'📅';
    const dr=diasR(e.fecha);
    const drTxt=dr===0?'Hoy':dr===1?'Mañana':dr>1?'En '+dr+' días':'Vencido';
    const drCls=dr===0?'hoy':dr<0?'vencida':'';
    const card=document.createElement('div'); card.className='ev-card';
    card.innerHTML=`<div class="ev-bar" style="background:${e.color||'#534AB7'}"></div>
      <div class="ev-info"><div class="ev-title">${ic} ${e.titulo}</div>
      <div class="ev-meta">${fmt(e.fecha)}${e.hora?' · '+e.hora:''} · <span class="${drCls}">${drTxt}</span></div></div>
      <button class="ev-del" data-id="${e.id}">×</button>`;
    list.appendChild(card);
  });
  list.querySelectorAll('.ev-del').forEach(b=>{
    b.addEventListener('click', function() { eliminar(this.dataset.id); });
  });
}

// --- Modal ---
document.getElementById('fab-btn').addEventListener('click', openModal);

function openModal() {
  document.getElementById('f-tit').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-fecha').value=selDate;
  document.getElementById('f-hora').value='';
  setTipo('cita', document.querySelector('.tipo-btn'));
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-tit').focus(), 200);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

function setTipo(t, btn) {
  tipo=t;
  document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('modal-h').textContent = t==='cita'?'Nueva cita':t==='tarea'?'Nueva tarea':'Nuevo aviso';
  document.getElementById('g-hora').style.display = t==='tarea'?'none':'block';
  document.getElementById('g-aviso').style.display = t==='tarea'?'none':'block';
}

document.getElementById('btn-guardar').addEventListener('click', function() {
  const tit = document.getElementById('f-tit').value.trim();
  const fecha = document.getElementById('f-fecha').value;
  if (!tit) { alert('Por favor escribe un título'); return; }
  if (!fecha) { alert('Por favor selecciona una fecha'); return; }

  const ev = {
    id: String(Date.now()),
    tipo: tipo,
    titulo: tit,
    desc: document.getElementById('f-desc').value.trim(),
    fecha: fecha,
    hora: document.getElementById('f-hora').value || null,
    aviso: parseInt(document.getElementById('f-aviso').value) || 0,
    color: document.getElementById('f-color').value || '#534AB7',
    done: false
  };

  // Cerrar modal PRIMERO
  closeModal();

  // Añadir evento y renderizar
  eventos.push(ev);
  renderCal();

  // Guardar en Supabase en background
  guardar();
});

function eliminar(id) {
  if(!confirm('¿Eliminar este evento?')) return;
  eventos=eventos.filter(e=>e.id!==id);
  guardar();
  renderCal();
  renderTareas();
  renderProximos();
}

// --- Supabase guardar/cargar ---
async function guardar() {
  const ind = document.getElementById('save-ind');
  ind.textContent = '● Guardando...';
  ind.style.color = '#BA7517';
  try {
    const copia = JSON.parse(JSON.stringify(eventos));
    const { error } = await db.from('agenda').upsert({ id: 1, contenido: copia });
    if (error) throw error;
    ind.textContent = '● Guardado';
    ind.style.color = '#1D9E75';
  } catch(err) {
    ind.textContent = '● Error';
    ind.style.color = '#D85A30';
    console.error(err);
  }
}

async function cargar() {
  try {
    const { data, error } = await db.from('agenda').select('contenido').eq('id',1).single();
    if (!error && data && data.contenido) eventos = data.contenido;
  } catch(e) { console.log('Sin datos'); }
  renderCal();
}

cargar();
</script>
</body>
</html>
